name: Check a data source's terms

# Manual: prints robots.txt and the automated-access / reuse clauses of the
# given terms pages (scripts/check_site_terms.py), to confirm a site may be
# collected before anything is built against it. Reads only; commits nothing.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated terms-page URLs
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check terms
        run: python scripts/check_site_terms.py ${{ inputs.urls }}

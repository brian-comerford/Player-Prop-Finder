name: Refresh track record only (no odds API)

# Runs on a schedule after every standard NFL time slot finishes (see
# below), plus can be triggered manually any time, to update graded
# results and the track record without spending Odds API quota.
# Re-fetches only the free nflverse/ESPN data (player stats, schedule/
# final scores) via scripts/grade_only.py, then rebuilds and redeploys
# the site using the current live props/game-props data unchanged
# (fetched from the site itself, since that data isn't committed to the
# repo).
on:
  workflow_dispatch: {}
  schedule:
    # All times are UTC -- GitHub Actions' schedule trigger has no
    # timezone support (CRON_TZ isn't honored), so these are converted
    # from US Eastern Time using the EST (UTC-5) offset. During Eastern
    # Daylight Time (mid-March-early November, which covers most of the
    # season's September-early-November games), that makes these fire
    # about an hour *later* than the ET time noted below, never earlier
    # -- more buffer after a game ends, not less.
    #
    # The late-night slots are scheduled just after midnight ET (rather
    # than 11:59pm) and off the :00/:30 marks entirely -- GitHub documents
    # that scheduled runs can be delayed (or dropped) during high-load
    # windows, which cluster right at the top of the hour, so :59/:00 is
    # about the worst minute to pick. A run queued late on a Friday never
    # fired at all (confirmed via the Actions run history: zero
    # schedule-triggered runs around the expected 04:59 UTC window).
    #
    # Sunday: 6pm ET (an hour after the early 1pm games), 9pm ET (after
    # the late-afternoon games), and just after midnight ET (after Sunday
    # Night Football).
    - cron: "0 23 * * SUN" # Sunday 6:00pm ET
    - cron: "0 2 * * MON" # Sunday 9:00pm ET
    - cron: "7 5 * * MON" # Monday 12:07am ET (after Sunday Night Football)
    # Thursday Night Football.
    - cron: "7 5 * * FRI" # Friday 12:07am ET (after Thursday Night Football)
    # Monday Night Football.
    - cron: "7 5 * * TUE" # Tuesday 12:07am ET (after Monday Night Football)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r scripts/requirements.txt

      - name: Re-fetch stats/schedule and re-grade (no odds API)
        working-directory: scripts
        run: python grade_only.py

      # props.json/meta.json/anytime_td_props.json/anytime_td_meta.json/
      # game_props.json/game_meta.json aren't committed to the repo (see
      # .gitignore) since they're normally rebuilt fresh from live odds
      # every run. This run deliberately skips the odds fetch, so it pulls
      # the currently-deployed copies from the live site instead --
      # unchanged from the last full run, since no new odds were fetched
      # to change them.
      - name: Fetch current live props/game data (unchanged since last full run)
        run: |
          mkdir -p data
          curl -sSL --fail https://brian-comerford.github.io/Player-Prop-Finder/data/props.json -o data/props.json
          curl -sSL --fail https://brian-comerford.github.io/Player-Prop-Finder/data/meta.json -o data/meta.json
          curl -sSL --fail https://brian-comerford.github.io/Player-Prop-Finder/data/anytime_td_props.json -o data/anytime_td_props.json
          curl -sSL --fail https://brian-comerford.github.io/Player-Prop-Finder/data/anytime_td_meta.json -o data/anytime_td_meta.json
          curl -sSL --fail https://brian-comerford.github.io/Player-Prop-Finder/data/game_props.json -o data/game_props.json
          curl -sSL --fail https://brian-comerford.github.io/Player-Prop-Finder/data/game_meta.json -o data/game_meta.json

      # On a race with deploy.yml (or another grade-only run) pushing at
      # the same time, favor this run's own just-computed content
      # (-X ours) rather than a plain rebase, which fails outright on a
      # real text conflict inside a regenerated JSON file -- either run's
      # recompute is a complete, valid state on its own, so there's
      # nothing to reconcile line-by-line; the losing run's data simply
      # gets recomputed fresh the next time it runs.
      - name: Commit updated pick history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No pick-history changes to commit."
          else
            git commit -m "Refresh track record [skip ci]"
            git push || (git fetch origin main && git merge -X ours --no-edit origin/main && git push) || echo "::warning::Couldn't push pick history this run -- will retry next run."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (pulls in the freshly generated data)
        working-directory: frontend
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Backfill pick history (historical odds)

# Manual only: spends Odds API credits (about 100 per game) to rebuild
# weeks the app never snapshotted and fill in missing prices. See
# scripts/backfill_history.py. Run with dry_run first to see the plan.
on:
  workflow_dispatch:
    inputs:
      season:
        description: Season
        required: true
        default: "2026"
      full_weeks:
        description: Weeks to rebuild picks for, comma-separated (blank = none)
        required: false
        default: ""
      price_weeks:
        description: Weeks to fill missing prices for, comma-separated (blank = none)
        required: false
        default: ""
      credit_floor:
        description: Stop once remaining Odds API credits fall below this
        required: true
        default: "7000"
      dry_run:
        description: List the plan without calling the odds API
        type: boolean
        default: true

permissions:
  contents: write

# Same group as deploy.yml and grade-only.yml, so a backfill can't race
# one of them committing data/history.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch stats & schedule
        working-directory: scripts
        run: python fetch_stats.py

      - name: Backfill
        working-directory: scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: >
          python backfill_history.py
          --season "${{ inputs.season }}"
          --full-weeks "${{ inputs.full_weeks }}"
          --price-weeks "${{ inputs.price_weeks }}"
          --credit-floor "${{ inputs.credit_floor }}"
          ${{ inputs.dry_run && '--dry-run' || '' }}

      # Credits are already spent by this point, so keep a copy of the
      # fetched odds and results even if the backfill or the push fails.
      # (Blank week inputs default to blank on purpose: GitHub swaps an
      # empty input for its default, so a non-blank default couldn't be
      # turned off.)
      - name: Save fetched odds and history as an artifact
        if: ${{ always() && !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: backfilled-history
          path: |
            data/backfill_quotes
            data/history

      - name: Commit backfilled history
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No pick-history changes to commit."
          else
            git commit -m "Backfill pick history from historical odds [skip ci]"
            git push || (git pull --rebase origin main && git push)
          fi

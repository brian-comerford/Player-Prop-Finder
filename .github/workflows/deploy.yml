name: Build data & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Once a day. The Odds API free tier is 500 credits/month, so keep this
    # infrequent -- raise it (e.g. a few times on Sundays) only if you're on
    # a paid odds plan.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch stats/odds and run the value model
        working-directory: scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python generate_data.py

      # Everything else in data/ is disposable and rebuilt from scratch every
      # run, but pick history (this week's snapshot, plus any past week the
      # model just finished grading) is the one thing that can't be rebuilt
      # after the fact -- it has to persist across runs, and this repo has
      # no database, so committing it back to the repo is the persistence
      # layer. A no-op commit (nothing changed) is expected on most runs.
      #
      # Deliberately non-fatal to the job: this is a secondary feature, and
      # a rare push race (e.g. a manual re-run overlapping the schedule)
      # shouldn't ever block the actual site deploy below. A dropped push
      # here just means the next run re-derives and re-commits the same
      # result -- grading is idempotent, so nothing is lost.
      - name: Commit updated pick history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No pick-history changes to commit."
          else
            git commit -m "Update pick history [skip ci]"
            git push || (git pull --rebase && git push) || echo "::warning::Couldn't push pick history this run -- will retry next run."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (pulls in the freshly generated data)
        working-directory: frontend
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

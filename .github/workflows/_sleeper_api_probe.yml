name: (scratch) Sleeper API probe

on:
  push:
    branches:
      - claude/serene-brown-j2g9w3
    paths:
      - .github/workflows/_sleeper_api_probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check player metadata for gsis_id crosswalk
        run: |
          echo "== players/nfl (metadata) =="
          curl -sS -w "\nHTTP %{http_code}\n" \
            "https://api.sleeper.app/v1/players/nfl" \
            -o /tmp/sleeper_players.json
          echo "--- byte count ---"
          wc -c < /tmp/sleeper_players.json
          echo "--- Justin Jefferson entry (search by full_name) ---"
          python3 -c "import json; d = json.load(open('/tmp/sleeper_players.json')); m = [p for p in d.values() if p.get('full_name') == 'Justin Jefferson']; print(json.dumps(m[0], indent=2)) if m else print('not found')"

name: (scratch) Sleeper API probe

on:
  push:
    branches:
      - claude/serene-brown-j2g9w3
    paths:
      - .github/workflows/_sleeper_api_probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check player metadata for gsis_id crosswalk (filtered to skill positions)
        run: |
          echo "== players/nfl (metadata) =="
          curl -sS -w "\nHTTP %{http_code}\n" \
            "https://api.sleeper.app/v1/players/nfl" \
            -o /tmp/sleeper_players.json
          echo "--- byte count ---"
          wc -c < /tmp/sleeper_players.json
          echo "--- all players named Justin Jefferson, WR/RB/TE/QB only ---"
          python3 -c "import json; d = json.load(open('/tmp/sleeper_players.json')); m = [p for p in d.values() if p.get('full_name') == 'Justin Jefferson' and p.get('position') in ('WR','RB','TE','QB')]; print(json.dumps(m, indent=2))"
          echo "--- gsis_id coverage across active WR/RB/TE/QB ---"
          python3 -c "import json; d = json.load(open('/tmp/sleeper_players.json')); skill = [p for p in d.values() if p.get('position') in ('WR','RB','TE','QB') and p.get('active')]; total = len(skill); has_gsis = sum(1 for p in skill if p.get('gsis_id')); print(f'{has_gsis}/{total} active skill-position players have a gsis_id')"

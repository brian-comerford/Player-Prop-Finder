name: (scratch) ESPN API probe

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/serene-brown-j2g9w3
    paths:
      - .github/workflows/_espn_api_probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try ESPN fantasy projections endpoint
        run: |
          echo "== kona_player_info (fantasy projections) =="
          curl -sS -D /tmp/espn_proj_headers.txt -w "\nHTTP %{http_code}\n" \
            "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026/segments/0/leaguedefaults/3?view=kona_player_info" \
            -H 'x-fantasy-filter: {"players":{"filterStatsForTopScoringPeriodIds":{"value":2,"additionalValue":["102026","002026","022026"]}}}' \
            -H 'Accept: application/json' \
            -o /tmp/espn_proj.json || true
          echo "--- response headers ---"
          cat /tmp/espn_proj_headers.txt || true
          echo "--- byte count ---"
          wc -c < /tmp/espn_proj.json || echo 0
          echo "--- first 3000 bytes of body ---"
          head -c 3000 /tmp/espn_proj.json || true

      - name: Try ESPN site scoreboard endpoint (sanity check reachability)
        run: |
          echo "== site.api.espn.com scoreboard =="
          curl -sS -D /tmp/espn_sb_headers.txt -w "\nHTTP %{http_code}\n" \
            "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" \
            -o /tmp/espn_sb.json || true
          echo "--- response headers ---"
          cat /tmp/espn_sb_headers.txt || true
          echo "--- byte count ---"
          wc -c < /tmp/espn_sb.json || echo 0
          echo "--- first 500 bytes of body ---"
          head -c 500 /tmp/espn_sb.json || true

name: (scratch) game odds market probe

on:
  push:
    branches:
      - claude/serene-brown-j2g9w3
    paths:
      - .github/workflows/_probe_game_odds.yml
      - scripts/_probe_game_odds.py

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas
      - working-directory: scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python _probe_game_odds.py

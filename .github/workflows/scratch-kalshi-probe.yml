name: Scratch Kalshi probe

on:
  workflow_dispatch:
  push:
    branches:
      - claude/serene-brown-j2g9w3
    paths:
      - "scripts/scratch_kalshi_probe.py"
      - ".github/workflows/scratch-kalshi-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/scratch_kalshi_probe.py
        working-directory: scripts

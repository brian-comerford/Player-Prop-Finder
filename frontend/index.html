<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Finds NFL player prop bets that look mispriced by comparing a statistical projection to sportsbook odds."
    />
    <title>Player Prop Finder</title>
    <script>
      // Applies any saved light/dark override before first paint, so
      // there's no flash of the wrong theme. Mirrors src/lib/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var isDark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
